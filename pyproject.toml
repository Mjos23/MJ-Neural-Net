[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mj-neural-net"
version = "0.1.0"
description = "MJ Neural Net: Bangel-native associative recall with bounded predictive node placement and independent review"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{name = "Michael Patrick Bangel"}]
dependencies = ["bangel-language==0.2.0rc1", "mj-memory-recall==0.1.0"]

[project.scripts]
mj-neural-net = "mj_neural_net.adapter:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mj_neural_net = ["*.json", "source/*.bangel", "docs/*.md", "docs/*.json", "examples/*.json", "data/*.json"]
